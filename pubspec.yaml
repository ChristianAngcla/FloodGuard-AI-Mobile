name: floodguard_ai
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  url_launcher: ^6.1.12
  geolocator: ^10.1.0
  http: ^1.6.0
  shared_preferences: ^2.2.2
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/new_logo_nobg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/geojson/
    - assets/geojson/marikina_barangays/
    - assets/geojson/marikina_barangays.geojson
    - assets/marikina.geojson
    - assets/marikina1.geojson
    - assets/logo.png
    - assets/flood_guard_icon-removebg.jpg
    - assets/new_logo_nobg.png
    - assets/icons/
